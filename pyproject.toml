[project]
name = "mealiectl"
version = "0.1.0"
description = "Command-line control for Mealie recipe-manager instances."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manoel Brunnen" }]
keywords = ["mealie", "recipes", "cli", "sync"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/mbrunnen/mealiectl"
Repository = "https://github.com/mbrunnen/mealiectl"

[project.scripts]
mealiectl = "mealiectl.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
